<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta http-equiv="X-UA-Compatible" content="IE=Edge"/>
<title>Workpaper Document Manager</title>
<style>
body { font-family: "Segoe UI", sans-serif; padding: 20px; font-size: 13px; }
#log { background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 6px; padding: 12px; margin-top: 12px; font-family: monospace; font-size: 11px; white-space: pre-wrap; word-break: break-all; max-height: 400px; overflow-y: auto; }
.ok  { color: #107C10; font-weight: bold; }
.err { color: #C50F1F; font-weight: bold; }
.inf { color: #0078D4; }
h2 { font-size: 15px; margin-bottom: 8px; }
</style>
</head>
<body>
<h2>Workpaper Doc Manager — Diagnostics</h2>
<p style="font-size:12px;color:#4b5563">This page is logging all errors to help diagnose the add-in issue.</p>
<div id="log">Starting...\n</div>

<script type="text/javascript">
var log = document.getElementById("log");

function addLog(msg, type) {
  type = type || "inf";
  var line = document.createElement("div");
  line.className = type;
  line.textContent = new Date().toISOString().slice(11,23) + " " + msg;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}

// Catch all unhandled errors
window.onerror = function(msg, src, line, col, err) {
  addLog("WINDOW ERROR: " + msg + " (line " + line + ")", "err");
  return false;
};

window.onunhandledrejection = function(e) {
  addLog("UNHANDLED PROMISE: " + (e.reason && e.reason.message ? e.reason.message : String(e.reason)), "err");
};

addLog("Page loaded", "ok");
addLog("Checking Office.js...", "inf");

// Check if Office.js loaded
if (typeof Office === "undefined") {
  addLog("Office is NOT defined — Office.js failed to load", "err");
} else {
  addLog("Office object found: " + typeof Office, "ok");
  addLog("Office.context: " + (Office.context ? "exists" : "null"), "inf");
}
</script>

<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"
  onload="addLog('Office.js script loaded OK', 'ok')"
  onerror="addLog('Office.js script FAILED to load', 'err')">
</script>

<script type="text/javascript">
addLog("Waiting for Office.onReady...", "inf");

function waitForOffice() {
  if (typeof Office === "undefined") {
    addLog("Office still not defined after load — fatal error", "err");
    return;
  }
  try {
    Office.onReady(function(info) {
      addLog("Office.onReady fired!", "ok");
      addLog("Host: " + (info.host || "unknown"), "ok");
      addLog("Platform: " + (info.platform || "unknown"), "ok");

      // Test Excel API
      try {
        addLog("Testing Excel.run...", "inf");
        Excel.run(function(ctx) {
          var sheets = ctx.workbook.worksheets;
          sheets.load("items/name");
          return ctx.sync().then(function() {
            addLog("Excel.run OK — found " + sheets.items.length + " sheet(s)", "ok");
            sheets.items.forEach(function(s) {
              addLog("  Sheet: " + s.name, "inf");
            });
          });
        }).catch(function(e) {
          addLog("Excel.run failed: " + e.message, "err");
        });
      } catch(e) {
        addLog("Excel object error: " + e.message, "err");
      }

      // Test fetch
      addLog("Testing fetch to graph.microsoft.com...", "inf");
      fetch("https://graph.microsoft.com/v1.0/$metadata", { method: "GET" })
        .then(function(r) { addLog("Fetch to Graph: HTTP " + r.status, r.status < 500 ? "ok" : "err"); })
        .catch(function(e) { addLog("Fetch to Graph FAILED: " + e.message, "err"); });

      // Test MSAL CDN reachability
      addLog("Testing MSAL CDN...", "inf");
      fetch("https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js", { method: "HEAD" })
        .then(function(r) { addLog("MSAL CDN reachable: HTTP " + r.status, r.status === 200 ? "ok" : "err"); })
        .catch(function(e) { addLog("MSAL CDN FAILED: " + e.message, "err"); });
    });
  } catch(e) {
    addLog("Office.onReady threw: " + e.message, "err");
  }
}

// Give office.js time to load if it hasn't yet
if (typeof Office !== "undefined") {
  waitForOffice();
} else {
  setTimeout(waitForOffice, 2000);
}
</script>
</body>
</html>
